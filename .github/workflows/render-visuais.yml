name: Renderizar visuais (sem áudio)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        parte: [0, 1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libatk-bridge2.0-0 libcups2 libpango-1.0-0 libcairo2
      - run: npm ci
      - run: npx remotion browser ensure
      - name: Renderizar 300 quadros desta parte
        run: |
          START=$(( ${{ matrix.parte }} * 300 ))
          END=$(( START + 299 )); if [ $END -gt 2043 ]; then END=2043; fi
          npx remotion render src/index.ts Barbearia out/parte.mp4 --frames=$START-$END --codec h264 --crf 16 --gl=angle
      - uses: actions/upload-artifact@v4
        with:
          name: visuais-parte-${{ matrix.parte }}
          path: out/parte.mp4
          retention-days: 1
